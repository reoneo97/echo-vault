[project]
name = "echovault-evals"
version = "0.1.0"
description = "EchoVault evaluation framework"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "mlflow>=2.16.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
